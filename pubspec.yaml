name: nothing_notes
description: "A minimal, offline-first todo app inspired by Nothing's industrial design."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  go_router: ^14.6.2
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
